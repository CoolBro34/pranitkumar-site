name: Deploy to GitHub Pages

# No build step is needed: this repository serves static HTML/CSS/JS and assets directly.

on:
  push:
    branches: [main]       # runs on every push to main
  workflow_dispatch:        # also lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# This should remain the only Pages deployment workflow to avoid competing publishes.
# A newer main-branch push supersedes an in-progress deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Site pages and their relative asset paths live at the repository root.
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
