<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061530">
  <meta name="description" content="Page not found. Returning to Pranit Kumar's homepage.">
  <meta http-equiv="refresh" content="5;url=/">
  <title>Page Not Found | Pranit Kumar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="/tz-table.js"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page {
      min-height: calc(100svh - 5rem);
      display: grid;
      place-items: center;
      padding-top: 2rem;
      padding-bottom: 4rem;
    }

    .error-card {
      width: min(100%, 760px);
      padding: clamp(1.5rem, 5vw, 4rem);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .error-code {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 24vw, 13rem);
      font-weight: 900;
      line-height: .82;
      letter-spacing: -.07em;
      color: var(--text-primary);
    }

    .error-title {
      margin: 1.8rem 0 .7rem;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
    }

    .error-copy {
      max-width: 420px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .redirect-note {
      margin: 1.5rem 0 1.25rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .72rem;
      letter-spacing: .04em;
      color: var(--text-muted);
    }

    .redirect-track {
      width: min(100%, 260px);
      height: 3px;
      margin: 0 auto 1.6rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--chip-border);
    }

    .redirect-progress {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left;
      background: var(--accent);
      animation: redirect-countdown 5s linear forwards;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .75rem 1.1rem;
      border: 1px solid var(--text-primary);
      border-radius: 999px;
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: .76rem;
      text-decoration: none;
      transition: color .2s ease, background .2s ease, border-color .2s ease;
    }

    .home-link:hover {
      color: var(--sky-bottom);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    @keyframes redirect-countdown {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .redirect-progress { animation: none; transform: scaleX(1); }
    }
  </style>
</head>
<body data-page="404">
  <div id="sky-bg" aria-hidden="true"></div>
<header class="topbar" id="topbar">
    <a class="brand" href="/" aria-label="Pranit Kumar home">PK</a>
    <a class="contact-rail" href="/#contact">Contact <span>↗</span></a>
  </header>

  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <p class="section-label">// LOST IN SPACE</p>
      <h1 class="error-code" aria-label="404">404</h1>
      <h2 class="error-title" id="error-title">This page drifted off course.</h2>
      <p class="error-copy">The page you’re looking for doesn’t exist, or may have moved. Let’s get you back to familiar orbit.</p>
      <p class="redirect-note" role="status">Returning to the homepage in 5 seconds…</p>
      <div class="redirect-track" aria-hidden="true">
        <div class="redirect-progress"></div>
      </div>
      <a class="home-link" href="/">Return home <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer>© 2026 Pranit Kumar</footer>

  <script src="/site.js"></script>
  <script src="/clouds.js"></script>
  <script>
    // Keep a working redirect even if the browser ignores the meta refresh.
    window.setTimeout(() => {
      window.location.replace('/');
    }, 5000);
  </script>
</body>
</html>
